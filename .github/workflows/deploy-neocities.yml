name: Deploy McCrackOS to Neocities

on:
  workflow_run:
    workflows:
      - McCrackOS browser build check
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-mccrackos-neocities
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Only deploy after the browser build succeeds. Manual runs are also allowed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install McCrackOS dependencies
        working-directory: artifacts/vertex-os
        run: npm install --no-package-lock

      - name: Copy standalone app bundles into the static site
        run: |
          set -euo pipefail
          mkdir -p artifacts/vertex-os/public/apps
          cp -a apps/. artifacts/vertex-os/public/apps/

      - name: Build the standalone single-file export
        working-directory: artifacts/vertex-os
        env:
          PORT: 5000
        run: npm run build:single

      - name: Build McCrackOS for Neocities
        working-directory: artifacts/vertex-os
        env:
          PORT: 5000
          # Neocities serves the site from its domain root, unlike GitHub Pages.
          BASE_PATH: /
        run: npm run build

      - name: Verify the generated website and its assets
        run: |
          set -euo pipefail
          test -s artifacts/vertex-os/dist/public/index.html
          test -s artifacts/vertex-os/dist/public/single/index.html
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'artifacts/vertex-os/dist/public';
          const html = fs.readFileSync(path + '/index.html', 'utf8');
          if (html.includes('/src/main.tsx') || html.includes('@vite/client')) {
            throw new Error('Production index.html still contains Vite development entry points.');
          }
          const refs = [...html.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)].map(m => m[1]);
          if (!refs.length) throw new Error('No built JS/CSS assets were referenced by index.html.');
          for (const ref of refs) {
            if (!fs.existsSync(path + ref)) throw new Error('Missing built asset: ' + ref);
          }
          const single = fs.readFileSync(path + '/single/index.html', 'utf8');
          // The bundled application can legitimately contain the literal
          // string "/src/main.tsx" in source maps or diagnostics. Validate
          // the actual HTML structure and size instead of searching its JS.
          if (single.length < 100000 || !/<html[\\s>]/i.test(single) || !/<script[\\s>]/i.test(single)) {
            throw new Error('Standalone export is missing or does not contain a bundled HTML application.');
          }
          console.log('Production entry point and ' + refs.length + ' JS/CSS assets verified.');
          console.log('Standalone HTML export verified (' + (single.length / 1024 / 1024).toFixed(1) + ' MiB).');
          NODE

      # Neocities is returning its HTML with a sandbox policy that blocks all scripts.
      # Keep the Neocities URL as the entry point, but redirect the browser to the
      # identical app deployed on GitHub Pages, where JavaScript is permitted.
      - name: Prepare Neocities redirect to the live McCrackOS app
        run: |
          cat > artifacts/vertex-os/dist/public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url=https://patrickmango49.github.io/McCrackOS/">
            <link rel="canonical" href="https://patrickmango49.github.io/McCrackOS/">
            <title>Opening McCrackOS…</title>
            <style>
              html,body{margin:0;min-height:100%;background:#080b12;color:#eefaff;font:16px system-ui,sans-serif}
              body{display:grid;place-items:center;min-height:100vh}
              main{text-align:center;padding:32px}
              a{color:#55dfff}
            </style>
          </head>
          <body>
            <main>
              <h1>Opening McCrackOS…</h1>
              <p><a href="https://patrickmango49.github.io/McCrackOS/">Continue to McCrackOS</a></p>
            </main>
          </body>
          </html>
          HTML

      - name: Verify the Neocities API key targets McCrackOS
        env:
          NEOCITIES_API_TOKEN: ${{ secrets.NEOCITIES_API_TOKEN }}
        run: |
          set -euo pipefail
          SITE_INFO=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $NEOCITIES_API_TOKEN" \
            https://neocities.org/api/info)
          SITE_NAME=$(printf '%s' "$SITE_INFO" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).info?.sitename ?? ''))")
          echo "Authenticated Neocities site: $SITE_NAME"
          if [ "$SITE_NAME" != "mccrackos" ]; then
            echo "ERROR: NEOCITIES_API_TOKEN belongs to '$SITE_NAME', not 'mccrackos'. Update the repository secret with the API key from the mccrackos site settings."
            exit 1
          fi

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          dist_dir: artifacts/vertex-os/dist/public
          cleanup: false
          neocities_supporter: false
          preview_before_deploy: true

      - name: Install Chromium smoke-test browser
        working-directory: artifacts/vertex-os
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Verify Neocities redirects to the working McCrackOS app
        working-directory: artifacts/vertex-os
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });

            const response = await page.goto('https://mccrackos.neocities.org/', {
              waitUntil: 'domcontentloaded',
              timeout: 90000
            });
            if (!response || !response.ok()) {
              throw new Error('Neocities returned HTTP ' + (response?.status() ?? 'no response'));
            }

            await page.waitForURL('https://patrickmango49.github.io/McCrackOS/**', { timeout: 30000 });
            await page.waitForFunction(
              () => {
                const root = document.getElementById('root');
                return Boolean(root && root.childElementCount > 0);
              },
              null,
              { timeout: 60000 }
            );

            const state = await page.evaluate(() => ({
              url: location.href,
              title: document.title,
              rootChildren: document.getElementById('root')?.childElementCount ?? 0,
              rootPreview: (document.getElementById('root')?.innerText ?? '').slice(0, 500)
            }));
            console.log('NEOCITIES REDIRECT + LIVE APP TEST: ' + JSON.stringify({ state, errors }, null, 2));

            if (!state.url.startsWith('https://patrickmango49.github.io/McCrackOS/')) {
              throw new Error('Neocities did not redirect to the GitHub Pages app.');
            }
            if (!state.rootChildren) throw new Error('McCrackOS did not render on GitHub Pages.');
            if (errors.length) throw new Error('Browser errors: ' + errors.join(' | '));
          } finally {
            await browser.close();
          }
          NODE
