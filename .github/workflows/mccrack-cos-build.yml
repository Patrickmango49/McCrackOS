name: McCrackOS browser build check

on:
  push:
    paths:
      - "artifacts/vertex-os/**"
      - "apps/**"
      - ".github/workflows/mccrack-cos-build.yml"
      - ".github/workflows/deploy-neocities.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mccrackos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/vertex-os
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Sync main before build
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Type-check
        run: npm run typecheck
      - name: Build downloadable single-file bundle
        env:
          PORT: 5000
        run: |
          set -euo pipefail
          npm run build:single
          mkdir -p ../../single
          cp public/single/index.html ../../single/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('../../single/index.html', 'utf8');
          const required = [
            'apps/messages/index.html',
            'apps/movies/index.html',
            'apps/music/web/index.html',
            'apps/youtube/public/index.html',
            'games/bowmasters.html',
            'games/ovo-3-dimensions.html',
            'games/ice-dodo.html',
            'games/block-blast.html',
            'games/jetpack-joyride.html',
            'games/baldis-basics.html',
          ];
          const missing = required.filter((key) => !html.includes(key));
          if (missing.length) throw new Error('Standalone HTML is missing bundled entries: ' + missing.join(', '));
          console.log('Verified all bundled app entry points and local game pages (' + (html.length / 1024 / 1024).toFixed(1) + ' MiB).');
          NODE
      - name: Build McCrackOS
        env:
          PORT: 5000
          BASE_PATH: /McCrackOS/
        run: npm run build
      - name: Publish built COS assets to GitHub Pages root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../assets ../../browser-ui ../../scramjet ../../controller ../../utils
          cp -a dist/public/assets/. ../../assets/
          cp -a dist/public/browser-ui/. ../../browser-ui/
          cp -a dist/public/scramjet/. ../../scramjet/
          cp -a dist/public/controller/. ../../controller/
          cp -a dist/public/utils/. ../../utils/
          cp dist/public/sw.js ../../sw.js
          cp dist/public/manifest.webmanifest ../../manifest.webmanifest
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const livePath = '../../index.html';
          const built = fs.readFileSync('dist/public/index.html', 'utf8');
          let live = fs.readFileSync(livePath, 'utf8');
          const jsTag = built.match(/<script type="module" crossorigin src="[^"]+">/)?.[0];
          const cssTag = built.match(/<link rel="stylesheet" crossorigin href="[^"]+">/)?.[0];
          if (!jsTag || !cssTag) throw new Error('Could not locate built JavaScript/CSS entry points.');
          live = live.replace(/<script type="module" crossorigin src="[^"]+">/, jsTag);
          live = live.replace(/<link rel="stylesheet" crossorigin href="[^"]+">/, cssTag);
          fs.writeFileSync(livePath, live);
          NODE
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets browser-ui scramjet controller utils sw.js single/index.html artifacts/vertex-os/public/single/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Deploy McCrackOS browser integration"
            git push origin HEAD:main
          fi

